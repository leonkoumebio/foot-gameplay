<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Foot Street — 3v3</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0d0d0d;
    overflow: hidden;
    height: 100%;
    font-family: -apple-system, sans-serif;
    touch-action: none;
  }
  #wrap {
    display: flex;
    justify-content: center;
    align-items: center;
        height: 100vh;
    height: 100dvh;
  }
        #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
  #stage canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #view3d { pointer-events: none; }
    #info {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    color: #eee;
    font-size: 12px;
    opacity: 0.7;
    z-index: 10;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 1px 3px #000;
    transition: opacity 1s;
    width: max-content;
    max-width: 90vw;
  }
  #info.hide { opacity: 0; }
  @media (pointer: coarse) { #info { display: none; } }
</style>
</head>
<body>
<div id="info">3v3 — Joystick/flèches: bouger • ESPACE/TIR: tir chargé • T/TACLE: récupérer • Shift/SPRINT: accélérer • P/PASSE: passer</div>
<div id="wrap">
  <div id="stage">
    <canvas id="view3d"></canvas>
    <canvas id="game" width="800" height="480"></canvas>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== Canvas 2D = interface (HUD, boutons) • Three.js = scène 3D =====

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

const PLAYER_BASE_SPEED = 140;
const PLAYER_SPRINT_SPEED = 240;
const DRIBBLE_OFFSET = 26;
const MIN_SHOOT_SPEED = 380;
const MAX_SHOOT_SPEED = 780;
const CHARGE_TIME = 0.7;
const BALL_FRICTION = 0.985;
const PICKUP_DIST = 30;
const PICKUP_MAX_SPEED = 40;
const GOAL_HALF_HEIGHT = 45;
const TACKLE_RANGE = 45;
const HOME_GOAL_X = 20;
const AWAY_GOAL_X = W - 20;

// ---- Joueur contrôlé ----
const p10 = { x: 200, y: H / 2, r: 14, facingX: 1, facingY: 0, side: 'home', label: '10', color: '#f5c518', speed: 150, attackTimer: 0, anchorX: 350, anchorY: H / 2 - 100 };
let player = p10; // joueur actuellement contrôlé

// ---- Coéquipiers IA (anchorX/Y = où ils reviennent quand ils ne pressent/dribblent pas) ----
const teammate1 = { x: 0, y: 0, r: 14, facingX: 1, facingY: 0, side: 'home', label: '7',  color: '#ffe082', speed: 150, attackTimer: 0, anchorX: W - 220, anchorY: H / 2 };
const teammate2 = { x: 0, y: 0, r: 14, facingX: 1, facingY: 0, side: 'home', label: '11', color: '#ffe082', speed: 130, attackTimer: 0, anchorX: 260,     anchorY: H / 2 + 120 };

// ---- Adversaires IA ----
const opp1 = { x: 0, y: 0, r: 14, facingX: -1, facingY: 0, side: 'away', label: '4', color: '#e53935', speed: 150, attackTimer: 0, anchorX: 520, anchorY: H / 2 - 70 };
const opp2 = { x: 0, y: 0, r: 14, facingX: -1, facingY: 0, side: 'away', label: '9', color: '#e53935', speed: 140, attackTimer: 0, anchorX: 600, anchorY: H / 2 + 70 };
const opp3 = { x: 0, y: 0, r: 14, facingX: -1, facingY: 0, side: 'away', label: '6', color: '#e53935', speed: 135, attackTimer: 0, anchorX: 560, anchorY: H / 2 };

const homeGK = { x: 34,     y: H / 2, r: 13, speed: 160 };
const awayGK = { x: W - 34, y: H / 2, r: 13, speed: 160 };

const homeField = [p10, teammate1, teammate2];
const awayField = [opp1, opp2, opp3];
let homeAI = [teammate1, teammate2]; // équipiers gérés par l'IA (change selon qui est contrôlé)
const awayAI = [opp1, opp2, opp3];

const ball = { x: 0, y: 0, r: 8, vx: 0, vy: 0, carrier: player, passTarget: null };

let scoreHome = 0;
let scoreAway = 0;
let matchTime = 90;
let matchOver = false;
let message = '';
let messageTimer = 0;
let charging = false;
let shootCharge = 0;
let tackleCooldown = 0;
let defenderFreeze = 0;
let sprinting = false;
let passCharging = false;
let passCharge = 0;
const PASS_MIN_SPEED = 300, PASS_MAX_SPEED = 600, PASS_CHARGE_TIME = 0.6;

// ---- Contrôles clavier ----
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') { e.preventDefault(); startCharge(); }
   if ((e.key === 't' || e.key === 'T') && !e.repeat) playerTackle();
    if (e.key === 'p' || e.key === 'P') startPass();
    if (e.key === 'Shift') sprinting = true;
  if ((e.key === 'c' || e.key === 'C') && !e.repeat) switchPlayer();
});
window.addEventListener('keyup', e => {
  keys[e.key] = false;
    if (e.key === ' ') releaseCharge();
  if (e.key === 'p' || e.key === 'P') releasePass();
  if (e.key === 'Shift') sprinting = false;
});

// ---- Joystick tactile ----
let joyActive = false;
let joyBaseX = 90, joyBaseY = H - 90;
let joyThumbX = joyBaseX, joyThumbY = joyBaseY;
let joyVecX = 0, joyVecY = 0;
const JOY_RADIUS = 50;
const JOY_ZONE_W = 220, JOY_ZONE_H = 180;

// ---- Boutons (taille unique) ----
let UI_W = W; // largeur réelle de l'interface (s'adapte à l'écran)
const BTN_R = 32;
const shootBtn  = { x: 0, y: H - 46,  r: BTN_R };
const tackleBtn = { x: 0, y: H - 46,  r: BTN_R };
const passBtn   = { x: 0, y: H - 112, r: BTN_R };
const sprintBtn = { x: 0, y: H - 112, r: BTN_R };
const switchBtn = { x: 0, y: H - 112, r: BTN_R };
function layoutButtons() {
  shootBtn.x  = UI_W - 50;
  tackleBtn.x = UI_W - 126;
  sprintBtn.x = UI_W - 50;
  passBtn.x   = UI_W - 126;
  switchBtn.x = UI_W - 202;
}

function getPointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  return {
    x: (touch.clientX - rect.left) * (canvas.width / rect.width),
    y: (touch.clientY - rect.top) * (H / rect.height)
  };
}

function inJoyZone(p) { return p.x >= 0 && p.x <= JOY_ZONE_W && p.y >= H - JOY_ZONE_H && p.y <= H; }
function inCircle(p, c) { const dx = p.x - c.x, dy = p.y - c.y; return Math.sqrt(dx * dx + dy * dy) <= c.r; }

function startJoy(p) { joyActive = true; joyBaseX = p.x; joyBaseY = p.y; joyThumbX = p.x; joyThumbY = p.y; }
function moveJoy(p) {
  const dx = p.x - joyBaseX, dy = p.y - joyBaseY;
  const dist = Math.min(Math.sqrt(dx * dx + dy * dy), JOY_RADIUS);
  const angle = Math.atan2(dy, dx);
  joyThumbX = joyBaseX + Math.cos(angle) * dist;
  joyThumbY = joyBaseY + Math.sin(angle) * dist;
  joyVecX = Math.cos(angle) * (dist / JOY_RADIUS);
  joyVecY = Math.sin(angle) * (dist / JOY_RADIUS);
}
function endJoy() { joyActive = false; joyVecX = 0; joyVecY = 0; joyThumbX = joyBaseX; joyThumbY = joyBaseY; }

function startCharge() { if (ball.carrier === player) charging = true; }
function releaseCharge() {
  if (!charging) return;
  charging = false;
  if (ball.carrier !== player) { shootCharge = 0; return; }
  const power = MIN_SHOOT_SPEED + (MAX_SHOOT_SPEED - MIN_SHOOT_SPEED) * Math.sqrt(shootCharge);
  ball.carrier = null;
  ball.vx = player.facingX * power;
    ball.vy = player.facingY * power;
  triggerKick(player, Math.sqrt(shootCharge), true);
  shootCharge = 0;
}

const SLIDE_DUR = 0.45; // durée de la glissade (secondes)

// Prend le ballon s'il est à portée (au sol ou chez un adversaire)
function tackleContact() {
  if (ball.carrier === player) return false;
  const src = ball.carrier ? (ball.carrier.side === 'away' ? ball.carrier : null) : ball;
  if (!src) return false;
    if (Math.hypot(src.x - player.x, src.y - player.y) >= TACKLE_RANGE) return false;
  if (src !== ball) src.fallT = FALL_DUR; // le porteur adverse tombe
  ball.carrier = player; ball.vx = 0; ball.vy = 0; ball.passTarget = null;
  tackleCooldown = 1.0;
  return true;
}

function playerTackle() {
  if (ball.carrier === player) return;
  if (player.slideT > 0 || performance.now() < (player.slideReady || 0)) return;
  player.slideT = SLIDE_DUR;
  player.slideReady = performance.now() + 900; // pas de glissade en boucle
  player.slideDx = player.facingX; player.slideDy = player.facingY;
  tackleContact();
}

// Ancienne version : plus utilisée, à supprimer plus tard
function playerTackleOld() {
  if (ball.carrier === player) return;
  if (!ball.carrier) {
    const dx = ball.x - player.x, dy = ball.y - player.y;
    if (Math.sqrt(dx * dx + dy * dy) < TACKLE_RANGE) {
      ball.carrier = player; ball.vx = 0; ball.vy = 0; ball.passTarget = null;
            tackleCooldown = 1.0;
    }
    return;
  }
  if (ball.carrier.side === 'away') {
    const dx = ball.carrier.x - player.x, dy = ball.carrier.y - player.y;
    if (Math.sqrt(dx * dx + dy * dy) < TACKLE_RANGE) {
      ball.carrier = player; ball.vx = 0; ball.vy = 0; ball.passTarget = null;
            tackleCooldown = 1.0;
    }
  }
}

function nearestTeammate(from, arr) {
  let best = null, bestDist = Infinity;
  for (const t of arr) {
    if (t === from) continue;
    const d = Math.hypot(t.x - from.x, t.y - from.y);
    if (d < bestDist) { bestDist = d; best = t; }
  }
  return best;
}

function passBall(from, to, speed) {
  const dx = to.x - from.x, dy = to.y - from.y;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  ball.carrier = null;
  ball.passTarget = to;
  ball.vx = (dx / dist) * speed;
    ball.vy = (dy / dist) * speed;
  triggerKick(from, 0.25, true);
}

function startPass() { if (ball.carrier === player) passCharging = true; }
function releasePass() {
  if (!passCharging) return;
  passCharging = false;
  const speed = PASS_MIN_SPEED + (PASS_MAX_SPEED - PASS_MIN_SPEED) * Math.sqrt(passCharge);
  passCharge = 0;
  playerPass(speed);
}
function playerPass(speed = 340) {
  if (ball.carrier !== player) return;
  const target = nearestTeammate(player, homeField);
    if (target) passBall(player, target, speed);
}

// ---- Tactile multi-doigts : chaque doigt est suivi par son identifiant ----
let joyTouchId = null;
const btnTouches = {}; // identifiant du doigt -> 'shoot' | 'sprint'

function getTouchPos(t) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (t.clientX - rect.left) * (canvas.width / rect.width),
    y: (t.clientY - rect.top) * (H / rect.height)
  };
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const p = getTouchPos(t);
    if (inCircle(p, shootBtn))       { startCharge(); btnTouches[t.identifier] = 'shoot'; }
    else if (inCircle(p, tackleBtn)) { playerTackle(); }
    else if (inCircle(p, passBtn))   { startPass(); btnTouches[t.identifier] = 'pass'; }
    else if (inCircle(p, sprintBtn)) { sprinting = true; btnTouches[t.identifier] = 'sprint'; }
    else if (switchVisible() && inCircle(p, switchBtn)) { switchPlayer(); }
    else if (inJoyZone(p) && joyTouchId === null) { joyTouchId = t.identifier; startJoy(p); }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === joyTouchId) moveJoy(getTouchPos(t));
  }
}, { passive: false });

function onTouchEnd(e) {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const id = e.changedTouches[i].identifier;
    if (id === joyTouchId) { joyTouchId = null; endJoy(); }
    else if (btnTouches[id] === 'shoot') { releaseCharge(); }
        else if (btnTouches[id] === 'pass') { releasePass(); }
    else if (btnTouches[id] === 'sprint') { sprinting = false; }
    delete btnTouches[id];
  }
}
canvas.addEventListener('touchend', onTouchEnd, { passive: false });
canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });

let mouseDown = false;
canvas.addEventListener('mousedown', e => {
  const p = getPointerPos(e);
  if (inCircle(p, shootBtn))  { startCharge(); return; }
  if (inCircle(p, tackleBtn)) { playerTackle(); return; }
  if (inCircle(p, passBtn))   { startPass(); return; }
  if (inCircle(p, sprintBtn)) { sprinting = true; return; }
    if (switchVisible() && inCircle(p, switchBtn)) { switchPlayer(); return; }
  if (inJoyZone(p)) { startJoy(p); mouseDown = true; }
});
canvas.addEventListener('mousemove', e => { if (mouseDown && joyActive) moveJoy(getPointerPos(e)); });
window.addEventListener('mouseup', () => { mouseDown = false; endJoy(); releaseCharge(); releasePass(); sprinting = false; });

// ---- Buts ----
function checkGoal() {
  const inGoalY = ball.y > H / 2 - GOAL_HALF_HEIGHT && ball.y < H / 2 + GOAL_HALF_HEIGHT;
  if (inGoalY && ball.x >= W - 18) {
        scoreHome++;
    message = 'BUT !'; messageTimer = 1.5;
    awayNetShake = 0.6;
    resetAfterGoal();
  } else if (inGoalY && ball.x <= 18) {
    scoreAway++;
    message = 'BUT ADVERSE'; messageTimer = 1.5;
    homeNetShake = 0.6;
    resetAfterGoal();
  }
}

function placeAtAnchor(e) { e.x = e.anchorX; e.y = e.anchorY; e.attackTimer = 0; e.decided = false; e.fallT = 0; }

let runOn = 0; // le nouveau joueur contrôlé continue sa course un instant
function setControlled(e) {
  if (player === e) return;
    charging = false; shootCharge = 0; passCharging = false; passCharge = 0;
  e.attackTimer = 0; e.decided = false;
  player = e;
  homeAI = homeField.filter(x => x !== e);
}

// Le bouton n'existe que lorsque l'adversaire a le ballon
function switchVisible() {
  return !matchOver && !!ball.carrier && ball.carrier.side === 'away';
}

// Donne le contrôle au joueur de mon équipe le plus proche du ballon (hors joueur actuel)
function switchPlayer() {
  if (!switchVisible()) return;
  let best = null, bestD = Infinity;
  for (const p of homeField) {
    if (p === player) continue;
    const d = Math.hypot(ball.x - p.x, ball.y - p.y);
    if (d < bestD) { bestD = d; best = p; }
  }
  if (best) { setControlled(best); runOn = 0; }
}

function resetAfterGoal() {
  setControlled(p10);
  player.x = 200; player.y = H / 2; player.facingX = 1; player.facingY = 0;
  for (const t of homeAI) placeAtAnchor(t);
  for (const o of awayAI) placeAtAnchor(o);
  homeGK.y = H / 2; awayGK.y = H / 2;
  ball.carrier = player; ball.vx = 0; ball.vy = 0; ball.passTarget = null;
  ball.x = player.x + DRIBBLE_OFFSET; ball.y = player.y;
  tackleCooldown = 0; defenderFreeze = 0;
}

function updateGK(gk, lineX, dt) {
  const minY = H / 2 - GOAL_HALF_HEIGHT + gk.r;
  const maxY = H / 2 + GOAL_HALF_HEIGHT - gk.r;
  const targetY = Math.max(minY, Math.min(maxY, ball.y));
    if (gk.y < targetY) gk.y = Math.min(gk.y + gk.speed * dt, targetY);
  else if (gk.y > targetY) gk.y = Math.max(gk.y - gk.speed * dt, targetY);

  if (!ball.carrier) {
    const dx = ball.x - gk.x, dy = ball.y - gk.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < gk.r + ball.r) {
      const angle = Math.atan2(dy, dx);
      const pushSpeed = 260;
      const dir = lineX < W / 2 ? 1 : -1;
      ball.vy = Math.sin(angle) * pushSpeed;
      ball.vx = dir * Math.abs(Math.cos(angle) * pushSpeed) + dir * 80;
      ball.passTarget = null;
      message = 'ARRÊTÉ !'; messageTimer = 1;
    }
  }
}

function checkPassCatch() {
  if (ball.carrier || !ball.passTarget) return;
  const t = ball.passTarget;
  const dx = ball.x - t.x, dy = ball.y - t.y;
  if (Math.sqrt(dx * dx + dy * dy) < PICKUP_DIST + 8) {
    ball.carrier = t; ball.vx = 0; ball.vy = 0; ball.passTarget = null;
  }
}

function tryPickup() {
  if (ball.carrier) return;
  const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
  if (speed >= PICKUP_MAX_SPEED) return;
    for (const c of [player, ...homeAI, ...awayAI]) {
    if (c.fallT > 0) continue; // un joueur à terre ne ramasse pas le ballon
    const dx = ball.x - c.x, dy = ball.y - c.y;
    if (Math.sqrt(dx * dx + dy * dy) < PICKUP_DIST) {
      ball.carrier = c; ball.vx = 0; ball.vy = 0; ball.passTarget = null;
      return;
    }
  }
}

// ---- IA générique (sert aussi bien aux coéquipiers qu'aux adversaires) ----
function updateFieldAI(e, dt, isPresser, sideField, attackGoalX) {
  if (e.fallT > 0) { e.fallT -= dt; return; } // à terre : ne bouge plus
  if (ball.carrier === e) {
    if (!e.decided) { e.decided = true; e.willPass = Math.random() < 0.45; }
    const targetX = attackGoalX, targetY = H / 2;
    const dx = targetX - e.x, dy = targetY - e.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 4) {
      e.facingX = dx / dist; e.facingY = dy / dist;
      e.x += e.facingX * e.speed * dt;
      e.y += e.facingY * e.speed * dt;
    }
    e.attackTimer += dt;
    if (e.willPass && e.attackTimer > 0.9 && e.attackTimer < 1.15) {
      const mate = nearestTeammate(e, sideField);
      if (mate) passBall(e, mate, 400);
      e.attackTimer = 0; e.decided = false;
    } else if (dist < 180 || e.attackTimer > 2.6) {
      const gy = H / 2 + (Math.random() - 0.5) * 50;
      const sdx = targetX - e.x, sdy = gy - e.y;
      const sdist = Math.sqrt(sdx * sdx + sdy * sdy) || 1;
      ball.carrier = null; ball.passTarget = null;
      ball.vx = (sdx / sdist) * 480;
            ball.vy = (sdy / sdist) * 480;
      triggerKick(e, 0.7, true);
      e.attackTimer = 0; e.decided = false;
    }
  } else {
    e.attackTimer = 0; e.decided = false;
    if (defenderFreeze > 0) return;

    const ownTeamHasBall = ball.carrier && ball.carrier.side === e.side;
    let tx, ty;
    if (ownTeamHasBall) {
      tx = e.anchorX; ty = e.anchorY;
    } else if (isPresser) {
      tx = ball.x; ty = ball.y;
    } else {
      tx = e.anchorX; ty = e.anchorY;
    }
    const dx = tx - e.x, dy = ty - e.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 4) {
      e.facingX = dx / dist; e.facingY = dy / dist;
      e.x += e.facingX * e.speed * dt;
      e.y += e.facingY * e.speed * dt;
    }

    if (!ownTeamHasBall && isPresser && ball.carrier && ball.carrier.side !== e.side && tackleCooldown <= 0) {
      const pdx = ball.carrier.x - e.x, pdy = ball.carrier.y - e.y;
      const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
            if (pdist < e.r + ball.carrier.r + 6) {
        triggerKick(e, 0.45, false);
        ball.carrier = e; ball.vx = 0; ball.vy = 0; ball.passTarget = null;
                tackleCooldown = 1.0;
      }
    }
  }
  e.x = Math.max(34, Math.min(W - 34, e.x));
  e.y = Math.max(34, Math.min(H - 34, e.y));
}

function closestToBall(arr) {
  let best = arr[0], bestDist = Infinity;
  for (const e of arr) {
    const d = Math.hypot(ball.x - e.x, ball.y - e.y);
    if (d < bestDist) { bestDist = d; best = e; }
  }
  return best;
}

// ---- Boucle de jeu ----
let lastTime = performance.now();

function update(dt) {
  if (matchOver) return;

  // Le contrôle passe automatiquement au joueur de mon équipe qui a le ballon
    if (ball.carrier && homeField.includes(ball.carrier) && ball.carrier !== player) { setControlled(ball.carrier); runOn = 0.4; }

  matchTime -= dt;
  if (matchTime <= 0) { matchTime = 0; matchOver = true; }

  let vx = 0, vy = 0;
  if (keys['ArrowLeft']) vx = -1; else if (keys['ArrowRight']) vx = 1;
  if (keys['ArrowUp']) vy = -1; else if (keys['ArrowDown']) vy = 1;
  if (joyActive && (joyVecX !== 0 || joyVecY !== 0)) { vx = joyVecX; vy = joyVecY; }

    let len = Math.sqrt(vx * vx + vy * vy);
  if (len > 0) runOn = 0;
    else if (runOn > 0) { runOn -= dt; vx = player.facingX; vy = player.facingY; len = 1; }
  // Glissade : trajectoire verrouillée, vitesse qui diminue, prise du ballon au contact
  let slideSpeed = 0;
  if (player.slideT > 0) {
    player.slideT -= dt;
    vx = player.slideDx; vy = player.slideDy; len = 1;
    slideSpeed = 40 + 220 * Math.max(0, player.slideT) / SLIDE_DUR;
    tackleContact();
  }
  if (len > 0) {
    vx /= len; vy /= len;
    player.facingX = vx; player.facingY = vy;
    const currentSpeed = slideSpeed || (sprinting ? PLAYER_SPRINT_SPEED : PLAYER_BASE_SPEED);
    player.x += vx * currentSpeed * dt;
    player.y += vy * currentSpeed * dt;
    player.x = Math.max(34, Math.min(W - 34, player.x));
    player.y = Math.max(34, Math.min(H - 34, player.y));
  }

  if (ball.carrier) {
    const c = ball.carrier;
    const targetBallX = c.x + c.facingX * DRIBBLE_OFFSET;
    const targetBallY = c.y + c.facingY * DRIBBLE_OFFSET;
        ball.x += (targetBallX - ball.x) * (1 - Math.pow(0.75, dt * 60));
        ball.y += (targetBallY - ball.y) * (1 - Math.pow(0.75, dt * 60));
  } else {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
        ball.vx *= Math.pow(BALL_FRICTION, dt * 60);
        ball.vy *= Math.pow(BALL_FRICTION, dt * 60);

    if (ball.y < 24) { ball.y = 24; ball.vy *= -0.6; }
    if (ball.y > H - 24) { ball.y = H - 24; ball.vy *= -0.6; }

    const inGoalY = ball.y > H / 2 - GOAL_HALF_HEIGHT && ball.y < H / 2 + GOAL_HALF_HEIGHT;
    if (!inGoalY) {
      if (ball.x < 24) { ball.x = 24; ball.vx *= -0.6; }
      if (ball.x > W - 24) { ball.x = W - 24; ball.vx *= -0.6; }
    }

    checkGoal();
    checkPassCatch();
    tryPickup();
  }

  const homePresser = closestToBall(homeAI);
  for (const t of homeAI) updateFieldAI(t, dt, t === homePresser, homeField, AWAY_GOAL_X);

  const awayPresser = closestToBall(awayAI);
  for (const o of awayAI) updateFieldAI(o, dt, o === awayPresser, awayField, HOME_GOAL_X);

    updateGK(homeGK, HOME_GOAL_X, dt);
    updateGK(awayGK, AWAY_GOAL_X, dt);

  if (tackleCooldown > 0) tackleCooldown -= dt;
  if (defenderFreeze > 0) defenderFreeze -= dt;
    if (charging) shootCharge = Math.min(shootCharge + dt / CHARGE_TIME, 1);
  if (passCharging && ball.carrier !== player) { passCharging = false; passCharge = 0; } // ballon perdu
  if (passCharging) passCharge = Math.min(passCharge + dt / PASS_CHARGE_TIME, 1);
  if (messageTimer > 0) messageTimer -= dt;
}

function drawGoalCage(yStart, yEnd, lineX, dir) {
  const depth = 22;
  const backX = lineX + dir * depth;
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
  for (let y = yStart; y <= yEnd; y += 9) { ctx.beginPath(); ctx.moveTo(lineX, y); ctx.lineTo(backX, y); ctx.stroke(); }
  for (let d = 0; d <= depth; d += 8) { const x = lineX + dir * d; ctx.beginPath(); ctx.moveTo(x, yStart); ctx.lineTo(x, yEnd); ctx.stroke(); }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(lineX, yStart); ctx.lineTo(backX, yStart);
  ctx.moveTo(lineX, yEnd); ctx.lineTo(backX, yEnd);
  ctx.moveTo(backX, yStart); ctx.lineTo(backX, yEnd);
  ctx.stroke();
}

function hudPill(x, y, w, h, fill) {
  const r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}

function drawHUD() {

  const x0 = W / 2 - (sw + gap + tw) / 2;
  hudPill(x0, top, sw, bh, 'rgba(0,0,0,0.7)');

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const cy = top + bh / 2 + 1;
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#f5c518'; ctx.fillText('VOUS', x0 + 42, cy);
  ctx.fillStyle = '#ff6b63'; ctx.fillText('ADV', x0 + sw - 42, cy);
  ctx.font = 'bold 22px sans-serif';
  ctx.fillStyle = '#fff'; ctx.fillText(scoreHome + ' - ' + scoreAway, x0 + sw / 2, cy);
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText(mm + ':' + ss, x0 + sw + gap + tw / 2, cy);

  // Messages (BUT !, ARRÊTÉ !...) sous le bandeau, avec contour sombre
  if (messageTimer > 0 && !matchOver) {
    ctx.font = 'bold 26px sans-serif';
    ctx.lineJoin = 'round'; ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(0,0,0,0.75)';
    ctx.strokeText(message, W / 2, top + bh + 26);

    ctx.fillText(message, W / 2, top + bh + 26);
  }
  ctx.textBaseline = 'top'; // l'écran de fin de match juste en dessous attend ce réglage

  if (matchOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px sans-serif';

}

function buildGoal(dir) {

    p.position.set(0, GH / 2, z); p.castShadow = true; g.add(p);

  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, gh * 2, 12), postMat);
  bar.rotation.x = Math.PI / 2; bar.position.set(0, GH, 0); bar.castShadow = true; g.add(bar);
  const backNet = netPlane(2 * gh, GH, dir * D, GH / 2, 0, 0, Math.PI / 2);
  backNet.userData.restX = backNet.position.x;
  g.add(backNet);

function makePlayerMesh(shirt, shorts, num, numColor) {

  const u = g.userData = { phase: Math.random() * 6.28, amp: 0, legs: [], shins: [], feet: [], arms: [], elbows: [] };
  const part = (geo, m, parent, x, y, z, shadow) => {
    const p = new THREE.Mesh(geo, m);
    p.position.set(x, y, z);
    p.castShadow = !!shadow;
    parent.add(p);

  };

  // ---- Jambes (articulations : hanche > genou > cheville) ----
  for (const sx of [-0.3, 0.3]) {
    const hip = new THREE.Group(); hip.position.set(sx, 1.4, 0); g.add(hip);

// ---- Synchronisation jeu (x, y) -> 3D (x, z) ----
// La vitesse réelle du joueur pilote la foulée
function animateRunner(m, px, pz, dt) {
  const u = m.userData;
  const dist = Math.hypot(px - m.position.x, pz - m.position.z);
  const spd = (dt > 0 && dist < 3) ? dist / dt : 0; // unités 3D / seconde (dist >= 3 = téléportation après un but)
  m.position.x = px; m.position.z = pz;
  const target = spd < 1 ? 0 : Math.min(spd / 14, 1.7); // 14 = vitesse normale, 1.7 = sprint
  u.amp += (target - u.amp) * Math.min(1, dt * 10);
  const a = u.amp;
  u.phase += dt * (7 + 6 * a);

  const s = Math.sin(u.phase), c = Math.cos(u.phase);
  const swing = 0.5 * Math.min(a, 1) + 0.4 * Math.max(0, a - 1); // amplitude de la cuisse
  const kneeMax = 1.2 * Math.min(a, 1.3);
  const armSwing = 0.8 * Math.min(a, 1.3);
  for (let i = 0; i < 2; i++) {
    const sg = i === 0 ? 1 : -1; // les deux jambes sont en opposition
    const th = -s * sg * swing;                    // négatif = jambe vers l'avant
    const kn = Math.max(0, c * sg) * kneeMax;      // genou plié quand la jambe revient vers l'avant
    u.legs[i].rotation.x = th;
    u.shins[i].rotation.x = kn;
    u.feet[i].rotation.x = -(th + kn) * 0.6;      // le pied reste presque à plat
    u.arms[i].rotation.x = s * sg * armSwing;      // bras opposé à la jambe du même côté
    u.elbows[i].rotation.x = -(0.25 + 0.7 * Math.min(a, 1));
  }
  m.position.y = -1.4 * (1 - Math.cos(swing * Math.abs(s))); // le bassin descend quand les jambes s'écartent
  m.rotation.x = 0.16 * Math.min(a, 1.3);                    // penché vers l'avant
}
const KICK_DUR = 0.34;
const FALL_DUR = 1.2; // durée totale de la chute d'un joueur tacle (secondes)
let kickHold = 0; // le ballon reste au pied jusqu'à l'impact

function triggerKick(e, power, hold) {
  const m = e.mesh;
  if (!m || e.slideT > 0) return;
  const u = m.userData;
  u.kickFrom = Math.max(u.wind || 0, 0.55); // point de départ = armement déjà fait
  u.kickPow = power;
  u.kickT = KICK_DUR;
  u.wind = 0;
  if (hold) kickHold = 0.05;
}

function applyActions(e, m, u, dt) {
  if (e !== player && e.slideT > 0) e.slideT = 0; // contrôle passé à un autre joueur
  const slideOn = e.slideT > 0;
  const sp = slideOn ? 1 - e.slideT / SLIDE_DUR : 1;
  const w = slideOn ? Math.max(0, Math.min(1, sp / 0.15, (1 - sp) / 0.3)) : 0; // descend vite, se relève
  u.slideW = w;

  // ---- Frappe : armement pendant la charge, puis coup de pied ----
   const wt = (e === player && charging) ? 0.35 + 0.65 * shootCharge : (e === player && passCharging) ? 0.35 + 0.4 * passCharge : 0;
  u.wind = (u.wind || 0) + (wt - (u.wind || 0)) * Math.min(1, dt * 12);
  let kw = 0, hip = 0, knee = 0, foot = 0, lean = 0;
  if (u.kickT > 0 && !slideOn) {
    u.kickT -= dt;
    const p = 1 - Math.max(u.kickT, 0) / KICK_DUR;
    const back = 0.6 * u.kickFrom, front = -(0.7 + 0.6 * u.kickPow);
    if (p < 0.18) {
      const q = p / 0.18;
      hip = back + (front - back) * q;
      knee = 1.2 * u.kickFrom * (1 - q) + 0.05;
      foot = 0.35 * q;
    } else {
      hip = front + 0.3 * (p - 0.18);
      knee = 0.05; foot = 0.35;
    }
    kw = p < 0.7 ? 1 : Math.max(0, (1 - p) / 0.3);
    lean = -0.12;
  } else if (u.wind > 0.02 && !slideOn) {
    hip = 0.6 * u.wind; knee = 1.2 * u.wind;
    kw = Math.min(1, u.wind * 2.5);
    lean = -0.1 * u.wind;
  }
  if (kw > 0) {
    const mk = (o, v) => { o.rotation.x += (v - o.rotation.x) * kw; };
    mk(u.legs[1], hip); mk(u.shins[1], knee); mk(u.feet[1], -(hip + knee) * 0.6 + foot);
    mk(u.shins[0], 0.3);                       // jambe d'appui légèrement fléchie
    mk(u.arms[0], -0.8); mk(u.arms[1], 0.5);   // bras opposé vers l'avant
    m.rotation.x += lean * kw;
  }

    // Bras écartés pour l'équilibre pendant la frappe
  u.arms[0].rotation.z = -1.1 * kw;
  u.arms[1].rotation.z = 1.1 * kw;

  // ---- Tacle glissé ----
  if (w > 0) {
    const mx = (o, v) => { o.rotation.x += (v - o.rotation.x) * w; };
    mx(u.legs[1], -0.55); mx(u.shins[1], 0); mx(u.feet[1], 0.9);  // jambe tendue vers l'avant
    mx(u.legs[0], -0.35); mx(u.shins[0], 2.6); mx(u.feet[0], -1.0); // jambe repliée dessous
    mx(u.arms[0], 1.7); mx(u.arms[1], 1.7);                        // bras en arrière pour l'appui
    mx(u.elbows[0], -0.2); mx(u.elbows[1], -0.2);
    m.rotation.x += (-1.2 - m.rotation.x) * w;                     // buste renversé en arrière
    m.position.y += (-0.1 - m.position.y) * w;                     // bassin près du sol
  }
  // Le corps couché est recentré vers l'avant (retiré avant le calcul de vitesse de l'image suivante)
    // ---- Chute : le joueur tacle trebuche vers l'avant ----
  let fw = 0;
  if (e.fallT > 0) {
    const fp = 1 - e.fallT / FALL_DUR;
    fw = Math.max(0, Math.min(1, fp / 0.18, (1 - fp) / 0.3)); // tombe vite, reste au sol, se relève
    fw = fw * fw * (3 - 2 * fw);
  }
  u.fallW = fw;
  if (fw > 0) {
    const mf = (o, v) => { o.rotation.x += (v - o.rotation.x) * fw; };
    mf(u.legs[0], 0.5); mf(u.shins[0], 1.4); mf(u.feet[0], 0.4);   // une jambe repliée en arrière
    mf(u.legs[1], 0.15); mf(u.shins[1], 0.5); mf(u.feet[1], 0);
    mf(u.arms[0], -2.6); mf(u.arms[1], -2.6);                      // bras tendus vers l'avant
    mf(u.elbows[0], -0.3); mf(u.elbows[1], -0.3);
    m.rotation.x += (1.5 - m.rotation.x) * fw;                     // à plat ventre
    m.position.y += (0.75 - m.position.y) * fw;                    // le corps repose sur le sol
  }
  const off = 1.4 * w - 2.0 * fw;
  u.offX = Math.sin(m.rotation.y) * off; u.offZ = Math.cos(m.rotation.y) * off;
  m.position.x += u.offX; m.position.z += u.offZ;
}

function syncPlayerMesh(e, t, dt) {
  const m = e.mesh, u = m.userData;
  m.position.x -= u.offX || 0; m.position.z -= u.offZ || 0;
  animateRunner(m, wx(e.x), wz(e.y), dt);
  // Le corps tourne progressivement vers sa direction
  let d = Math.atan2(e.facingX, e.facingY) - m.rotation.y;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  m.rotation.y += d * Math.min(1, dt * 14);
  applyActions(e, m, u, dt);
}
function syncGK(gk, angle, dt) {
  animateRunner(gk.mesh, wx(gk.x), wz(gk.y), dt);
  gk.mesh.rotation.y = angle;
}
function toScreen(x, y, h) {
  const v = new THREE.Vector3(wx(x), h, wz(y)).project(camera);
   return { x: (v.x + 1) / 2 * UI_W, y: (1 - v.y) / 2 * H };
}

let camPrevT = 0;
let ballPrevX = 0, ballPrevZ = 0, carryBlend = 0, carryX = 0, carryZ = 0, carryY = 0.5;
function updateNetShake(mesh, timer, dir, dt) {
  if (timer <= 0) { mesh.position.x = mesh.userData.restX; return timer; }
  timer -= dt;
  const amp = Math.max(timer, 0) * 1.4;
  mesh.position.x = mesh.userData.restX + dir * Math.sin(timer * 26) * amp;
  if (timer <= 0) mesh.position.x = mesh.userData.restX;
  return timer;
}

function render3D(t) {

  camX += (camTarget - camX) * Math.min(1, dtc * 4);
  camera.position.x = camX;
  camera.lookAt(camX, 0, 0);

  homeNetShake = updateNetShake(homeNetBack, homeNetShake, -1, dtc);
  awayNetShake = updateNetShake(awayNetBack, awayNetShake, 1, dtc);

    for (const e of allField) syncPlayerMesh(e, t, dtc);

  marker.position.set(wx(player.x), 0.08, wz(player.y));

    const bx = wx(ball.x), bz = wz(ball.y);
  // Le roulement suit la position logique du ballon
  ballMesh.rotation.z -= (bx - ballPrevX) / 0.5;
  ballMesh.rotation.x += (bz - ballPrevZ) / 0.5;
  ballPrevX = bx; ballPrevZ = bz;

  // Porté : le ballon est touché à chaque foulée, en alternant les pieds
  const cm = ball.carrier && ball.carrier.mesh;
  if (cm) {
    const cu = cm.userData, a = Math.min(cu.amp, 1);
    const s = Math.sin(cu.phase), r = cm.rotation.y;
        const d = 1.45 + 0.45 * Math.abs(s) * a - 0.55 * (cu.slideW || 0); // avance quand le pied est devant
    const lat = -0.3 * s * a;                // passe d'un pied à l'autre
    carryX = cm.position.x + Math.sin(r) * d + Math.cos(r) * lat;
    carryZ = cm.position.z + Math.cos(r) * d - Math.sin(r) * lat;
    carryY = 0.5 + 0.1 * a * Math.abs(Math.cos(cu.phase));
    carryBlend = Math.min(1, carryBlend + dtc * 8);
    } else if (kickHold <= 0) {
    carryBlend = Math.max(0, carryBlend - dtc * 12); // le ballon quitte le pied en quelques images
  }
  if (kickHold > 0) kickHold -= dtc;
  ballMesh.position.set(
    bx + (carryX - bx) * carryBlend,
    0.5 + (carryY - 0.5) * carryBlend,
    bz + (carryZ - bz) * carryBlend
  );

  renderer.render(scene, camera);
}

function render() {
  render3D(performance.now() / 1000);
    ctx.clearRect(0, 0, UI_W, H);
    drawPowerBar();
  drawPassBar();
  drawJoystick();
  drawButtons();
  drawHUD();
}

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ---- Initialisation des positions ----
setTimeout(() => document.getElementById('info').classList.add('hide'), 8000);
for (const t of homeAI) placeAtAnchor(t);
for (const o of awayAI) placeAtAnchor(o);
ball.x = player.x + DRIBBLE_OFFSET; ball.y = player.y;

requestAnimationFrame(loop);
</script>
